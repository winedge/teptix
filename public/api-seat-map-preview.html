<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Seat Map Preview</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #111827;
            background: #f3f4f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 24px auto;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(120px, 160px) 1fr auto;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #ffffff;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #4b5563;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            min-height: 40px;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            min-height: 40px;
            padding: 8px 16px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: wait;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .pill {
            padding: 8px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            background: #ffffff;
            color: #374151;
            font-size: 13px;
        }

        .shell {
            overflow: auto;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #ffffff;
            max-height: 72vh;
        }

        .stage {
            position: relative;
            width: 100%;
            min-width: 750px;
            line-height: 0;
            background:
                linear-gradient(90deg, rgba(17, 24, 39, 0.05) 1px, transparent 1px),
                linear-gradient(0deg, rgba(17, 24, 39, 0.05) 1px, transparent 1px),
                #f9fafb;
            background-size: 30px 30px;
        }

        .stage img {
            display: block;
            width: 100%;
            height: auto;
            min-height: 420px;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }

        .seat {
            position: absolute;
            width: clamp(16px, 2.1vw, 24px);
            height: clamp(20px, 2.5vw, 28px);
            padding: 0;
            transform: translate(-50%, -50%);
            border: 2px solid #d1d5db;
            border-radius: 5px;
            background: #ffffff;
            color: #111827;
            font-size: clamp(8px, 1vw, 10px);
            font-weight: 700;
            line-height: calc(clamp(20px, 2.5vw, 28px) - 4px);
            text-align: center;
            box-shadow: 0 2px 8px rgba(17, 24, 39, 0.25);
            z-index: 2;
        }

        .seat.available {
            background: #ffffff;
            color: #111827;
        }

        .seat.selected {
            border-color: #047857;
            background: #22c55e;
            color: #ffffff;
        }

        .seat.held {
            border-color: #f59e0b;
            background: #facc15;
            color: #111827;
        }

        .seat.booked {
            border-color: #b91c1c;
            background: #ef4444;
            color: #ffffff;
        }

        .seat.blocked {
            border-color: #6b7280;
            background: #9ca3af;
            color: #ffffff;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
            color: #4b5563;
            font-size: 13px;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .swatch {
            width: 14px;
            height: 14px;
            border: 1px solid #d1d5db;
            border-radius: 50%;
            background: var(--color);
        }

        .message {
            padding: 16px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
        }

        @media (max-width: 720px) {
            .page {
                width: calc(100% - 20px);
                margin: 10px auto;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <form class="toolbar" id="controls">
            <div>
                <label for="event-id">Event ID</label>
                <input id="event-id" name="event" value="54" inputmode="numeric">
            </div>
            <div>
                <label for="ticket-ids">Ticket IDs</label>
                <input id="ticket-ids" name="tickets" placeholder="Auto loads ticket IDs from API seats">
            </div>
            <button id="load-button" type="submit">Load API Layout</button>
        </form>

        <section class="summary" id="summary"></section>
        <section class="shell">
            <div class="stage" id="stage"></div>
        </section>
        <section class="legend" id="legend"></section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const eventInput = document.getElementById('event-id');
        const ticketInput = document.getElementById('ticket-ids');
        const controls = document.getElementById('controls');
        const loadButton = document.getElementById('load-button');
        const summary = document.getElementById('summary');
        const stage = document.getElementById('stage');
        const legend = document.getElementById('legend');

        eventInput.value = params.get('event') || eventInput.value;
        ticketInput.value = params.get('tickets') || '';

        function parseIds(value) {
            return String(value || '')
                .split(',')
                .map((item) => item.trim())
                .filter(Boolean);
        }

        function apiUrl(eventId, ticketIds) {
            const query = new URLSearchParams();
            ticketIds.forEach((ticketId) => query.append('ticket_ids[]', ticketId));
            return `/api/user/event-seat-map/${encodeURIComponent(eventId)}${query.toString() ? `?${query}` : ''}`;
        }

        async function fetchSeatMap(eventId, ticketIds, allowAutoTickets) {
            const response = await fetch(apiUrl(eventId, ticketIds), {
                headers: {
                    Accept: 'application/json'
                }
            });
            const payload = await response.json();

            if (!response.ok || !payload.success) {
                throw new Error(payload.msg || 'Unable to load seat map API payload.');
            }

            const data = payload.data;
            if (allowAutoTickets && ticketIds.length === 0 && data.uses_ticket_rows) {
                const autoTicketIds = [...new Set(data.seats.map((seat) => seat.ticket_id).filter(Boolean))];
                if (autoTicketIds.length > 0) {
                    ticketInput.value = autoTicketIds.join(',');
                    return fetchSeatMap(eventId, autoTicketIds, false);
                }
            }

            return data;
        }

        function renderSummary(data) {
            const available = data.seats.filter((seat) => seat.status === 'available').length;
            const booked = data.seats.filter((seat) => seat.status === 'booked').length;
            const held = data.seats.filter((seat) => seat.status === 'held').length;

            summary.innerHTML = [
                `Event ${data.event_id}`,
                data.map.venue_name || 'Venue',
                `${data.seats.length} seats`,
                `${available} available`,
                `${booked} booked`,
                `${held} held`
            ].map((text) => `<span class="pill">${text}</span>`).join('');
        }

        function renderStage(data) {
            const map = data.map;
            const width = Number(map.background_width) || 750;
            const height = Number(map.background_height) || 550;
            stage.style.aspectRatio = `${width} / ${height}`;
            stage.style.minWidth = `${Math.max(720, width)}px`;
            stage.innerHTML = '';

            if (map.background_image_url) {
                const image = document.createElement('img');
                image.src = map.background_image_url;
                image.alt = `${map.venue_name || 'Venue'} seat map`;
                stage.appendChild(image);
            } else {
                const spacer = document.createElement('img');
                spacer.alt = '';
                spacer.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 750 550%22%3E%3C/svg%3E';
                stage.appendChild(spacer);
            }

            data.seats.forEach((seat) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `seat ${seat.class_status || seat.status || 'available'}`;
                button.style.left = `${Number(seat.x_percent) || 50}%`;
                button.style.top = `${Number(seat.y_percent) || 50}%`;
                button.title = `${seat.seat_label} - ${seat.ticket_name || seat.status}`;
                button.textContent = seat.seat_number;
                stage.appendChild(button);
            });
        }

        function renderLegend(data) {
            const entries = Object.assign({}, data.legend || {}, {
                blocked: {
                    label: 'Blocked',
                    color: '#9ca3af'
                }
            });
            legend.innerHTML = Object.keys(entries).map((key) => {
                const item = entries[key];
                return `<span><i class="swatch" style="--color:${item.color}"></i>${item.label}</span>`;
            }).join('');
        }

        async function loadLayout() {
            loadButton.disabled = true;
            stage.innerHTML = '<div class="message">Loading API layout...</div>';
            legend.innerHTML = '';
            summary.innerHTML = '';

            try {
                const eventId = eventInput.value.trim() || '54';
                const ticketIds = parseIds(ticketInput.value);
                const data = await fetchSeatMap(eventId, ticketIds, true);
                renderSummary(data);
                renderStage(data);
                renderLegend(data);

                const nextUrl = new URL(window.location.href);
                nextUrl.searchParams.set('event', eventId);
                if (ticketInput.value.trim()) {
                    nextUrl.searchParams.set('tickets', ticketInput.value.trim());
                } else {
                    nextUrl.searchParams.delete('tickets');
                }
                window.history.replaceState({}, '', nextUrl);
            } catch (error) {
                stage.innerHTML = `<div class="message">${error.message}</div>`;
            } finally {
                loadButton.disabled = false;
            }
        }

        controls.addEventListener('submit', function (event) {
            event.preventDefault();
            loadLayout();
        });

        loadLayout();
    </script>
</body>
</html>
